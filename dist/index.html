<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CADDYBOX</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060906;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
      background: transparent;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.86);
      z-index: 100;
      transition: opacity 0.4s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-box {
      text-align: center;
      padding: 24px 32px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      backdrop-filter: blur(10px);
    }

    .loading-spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(255, 255, 255, 0.18);
      border-top-color: #8aff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 16px;
      line-height: 1.4;
      color: #f8fdf8;
    }

    .status-message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(0,0,0,0.65);
      color: #e6ffe6;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 110;
    }

    .status-message.visible {
      opacity: 1;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-DoQfMUdy.js"></script>
</head>
<body>
  <div id="app">
    <canvas id="scene-canvas"></canvas>

    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-box">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading CADDYBOX model...</div>
      </div>
    </div>

    <div id="status-message" class="status-message"></div>
  </div>

</body>
</html>
