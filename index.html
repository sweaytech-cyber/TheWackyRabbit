<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arm Motion Tracker</title>
  <meta name="description" content="Real-time arm motion tracker using your webcam. Draw trails with your wrist movement." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Main Container -->
  <div id="app">

    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="url(#grad1)" opacity="0.2"/>
            <path d="M12 6v6l4 2" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
            <defs><linearGradient id="grad1" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
          </svg>
        </div>
        <h1>Arm Motion Tracker</h1>
      </div>
      <div class="header-right">
        <span id="fps-display" class="badge">-- FPS</span>
        <span id="status-badge" class="badge badge-inactive">Webcam Off</span>
      </div>
    </header>

    <!-- Canvas Area -->
    <main id="main-area">
      <!-- Hidden video element for webcam feed -->
      <video id="webcam" autoplay playsinline style="display:none;"></video>

      <div id="canvas-wrapper">
        <!-- Video feed canvas (bottom layer) -->
        <canvas id="video-canvas"></canvas>
        <!-- Drawing trail canvas (top layer) -->
        <canvas id="drawing-canvas"></canvas>
        <!-- Landmark overlay canvas -->
        <canvas id="landmark-canvas"></canvas>

        <!-- Start overlay -->
        <div id="start-overlay">
          <div class="start-content">
            <div class="start-icon">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="url(#startGrad)" stroke-width="1.5" opacity="0.5"/>
                <path d="M15.5 12L10 15.5V8.5L15.5 12Z" fill="url(#startGrad)"/>
                <defs><linearGradient id="startGrad" x1="2" y1="2" x2="22" y2="22"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
              </svg>
            </div>
            <h2>Ready to Track</h2>
            <p>Click the button below to start your webcam and begin tracking your arm movement.</p>
            <button id="start-btn" onclick="startWebcam()">
              <span class="btn-glow"></span>
              Start Webcam
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Controls Bar -->
    <footer id="controls-bar">
      <div class="control-group">
        <label>Brush</label>
        <div class="thickness-control">
          <button id="thickness-down" onclick="changeThickness(-1)" title="Decrease thickness">−</button>
          <span id="thickness-value">5</span>
          <button id="thickness-up" onclick="changeThickness(1)" title="Increase thickness">+</button>
        </div>
      </div>

      <div class="control-group">
        <label>Smoothing</label>
        <input type="range" id="smoothing-slider" min="10" max="90" value="50" oninput="updateSmoothing(this.value)" />
        <span id="smoothing-value" class="slider-val">0.50</span>
      </div>

      <div class="control-group">
        <label>Hand</label>
        <select id="hand-select" onchange="updateHand(this.value)">
          <option value="right">Right</option>
          <option value="left">Left</option>
        </select>
      </div>

      <div class="control-group">
        <label>View</label>
        <select id="view-select" onchange="updateView(this.value)">
          <option value="overlay">Overlay</option>
          <option value="black">Black BG</option>
        </select>
      </div>

      <div class="control-spacer"></div>

      <div class="control-actions">
        <button class="action-btn" id="clear-btn" onclick="clearCanvas()" title="Clear drawing (C)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
          Clear
        </button>
        <button class="action-btn action-save" id="save-btn" onclick="saveDrawing()" title="Save drawing (S)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
          Save
        </button>
      </div>
    </footer>

    <!-- Toast notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Color legend  -->
    <div id="color-legend">
      <div class="legend-title">Speed</div>
      <div class="legend-bar"></div>
      <div class="legend-labels">
        <span>Slow</span><span>Fast</span>
      </div>
    </div>
  </div>

  <!-- MediaPipe Pose via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
  <script src="style.js"></script>
</body>
</html>
